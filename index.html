:root[data-theme="dark"]{--bg:#1c1917;--card:#292524;--tx:#f3ede6;--mu:#a39a90;--ac:#e8836b;--bd:#3d3733;--ok:#6cc08b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans JP","Noto Sans Devanagari",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;min-height:100dvh}
.top,.bar,.card,.row,.stats{width:100%;max-width:480px}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
.stats{color:var(--mu);font-size:12.5px;margin-top:2px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.card{position:relative;height:clamp(300px,50dvh,480px);background:var(--card);border:1px solid var(--bd);border-radius:18px;display:flex;overflow-y:auto;padding:22px 18px;cursor:pointer;user-select:none;-webkit-overflow-scrolling:touch}
.in{margin:auto;width:100%;text-align:center}
.jp{font-size:clamp(26px,8vw,34px);font-weight:600;line-height:1.4;word-break:break-all}
.hint{color:var(--mu);font-size:13px;margin-top:14px}
.en{font-size:clamp(18px,5.4vw,22px);font-weight:600;line-height:1.35}
.ne{font-size:clamp(18px,5.4vw,22px);color:var(--ac);margin-top:8px;line-height:1.45}
.ex{margin-top:16px;padding-top:14px;border-top:1px dashed var(--bd);text-align:left}
.ex small{display:block;color:var(--mu);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.exj{font-size:clamp(17px,5vw,20px);font-weight:600;line-height:1.5}
.exe{font-size:14.5px;margin-top:5px;line-height:1.4}
.exn{font-size:14.5px;color:var(--ac);margin-top:3px;line-height:1.5}
.bd{position:absolute;top:10px;right:12px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);background:var(--card)}
.bd.k{color:var(--ok);border-color:var(--ok)}
.bd.l{color:var(--ac);border-color:var(--ac)}
.row{display:flex;gap:8px;margin-top:10px}
button{flex:1;min-height:48px;padding:10px 6px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.row.sm button{font-size:14px}
</style></head><body>

"ひつようじこう":["ひつようじこうを かいて ください。","Please write the necessary information.","कृपया आवश्यक विवरण लेख्नुहोस्।"],
"もうしこみ":["もうしこみは あしたまでです。","The application is until tomorrow.","आवेदन भोलिसम्म हो।"],
"せんちゃくじゅん":["せんちゃくじゅんで ごじゅうにんです。","It is first-come first-served, for 50 people.","पहिले आउने पहिले पाउने आधारमा ५० जना।"],
"じゅんばんに":["じゅんばんに はなして ください。","Please speak in order.","कृपया क्रमैसँग बोल्नुहोस्।"],
"いただく":["おかしを いただきます。","I receive some sweets. (polite)","म मिठाई पाउँछु। (आदरार्थी)"],
"いんしょく":["ここは いんしょくきんしです。","Eating and drinking are prohibited here.","यहाँ खानपान निषेध छ।"],
"さつえい":["さつえいは きんしです。","Photography is prohibited.","फोटो/भिडियो खिच्न निषेध छ।"],
"はんばい":["おかしを はんばいして います。","Sweets are being sold.","मिठाई बिक्री भइरहेको छ।"],
"けいたいでんわ":["けいたいでんわを きって ください。","Please turn off your mobile phone.","कृपया मोबाइल फोन बन्द गर्नुहोस्।"],
"しゅうりょうする":["おまつりは ごじに しゅうりょうします。","The festival ends at 5 o’clock.","मेला ५ बजे समाप्त हुन्छ।"],
"こすう":["こすうは じゅっこです。","The quantity is ten pieces.","संख्या दश वटा हो।"],
"かぎられている":["こすうが かぎられて います。","The quantity is limited.","संख्या सीमित छ।"],
"おもとめの":["おもとめの かたは こちらへ どうぞ。","Those wishing to buy, please come this way.","किन्न चाहने व्यक्ति यता आउनुहोस्।"],
"おならびください":["ここに おならびください。","Please line up here.","कृपया यहाँ लाइनमा बस्नुहोस्।"]
};
const ALL=RAW.split("\n").map((l,n)=>{const p=l.split("|");return{id:n,jp:p[0],en:p[1],ne:p[2]}});
const KEY="jpvocab_status_v1";
let st={};
try{st=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const isK=c=>st[c.id]==="known";
let mode="all",deck=ALL.slice(),i=0,flip=false,armed=false;
const $=id=>document.getElementById(id);
function deckFor(m){return m==="learned"?ALL.filter(isK):m==="unknown"?ALL.filter(c=>!isK(c)):ALL.slice()}
function setMode(m){mode=m;deck=deckFor(m);i=0;flip=false;render()}
function render(){
 const nk=ALL.filter(isK).length,nl=ALL.filter(c=>st[c.id]==="learning").length;
 $("kn").textContent="Got it: "+nk+" / "+ALL.length;
 $("st").textContent="Still learning: "+nl+" · Not studied yet: "+(ALL.length-nk-nl);
 $("pb").style.width=(nk/ALL.length*100)+"%";
 $("rs").classList.toggle("on",mode==="unknown");
 $("rl").classList.toggle("on",mode==="learned");
 $("am").classList.toggle("on",mode==="all");
 const c=deck[i];
 if(!c){
  const msg=mode==="learned"?"No cards marked “Got it” yet.":mode==="unknown"?"All cards learned 🎉":"No cards.";
  $("card").innerHTML='<div class="in"><div class="en">'+msg+'</div><div class="hint">Use “All cards” to go back.</div></div>';
  $("pos").textContent="0 / 0";return}
 const s=st[c.id],b=s==="known"?'<span class="bd k">✓ Got it</span>':s==="learning"?'<span class="bd l">Still learning</span>':'';
 let h;
 if(flip){
  const e=EX[c.jp];
  h='<div class="in"><div class="en">'+c.en+'</div><div class="ne">'+c.ne+'</div>'+
   (e?'<div class="ex"><small>Example</small><div class="exj">'+e[0]+'</div><div class="exe">'+e[1]+'</div><div class="exn">'+e[2]+'</div></div>':'')+'</div>';
 }else h='<div class="in"><div class="jp">'+c.jp+'</div><div class="hint">Tap to flip</div></div>';
 $("card").innerHTML=b+h;
 $("card").scrollTop=0;
 $("pos").textContent=(i+1)+" / "+deck.length;
}
function go(d){if(!deck.length)return;i=(i+d+deck.length)%deck.length;flip=false;render()}
function mark(s){const c=deck[i];if(!c)return;st[c.id]=s;save();go(1)}
$("card").onclick=()=>{if(!deck.length)return;flip=!flip;render()};
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("yes").onclick=()=>mark("known");
$("no").onclick=()=>mark("learning");
$("sh").onclick=()=>{for(let k=deck.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[deck[k],deck[j]]=[deck[j],deck[k]]}i=0;flip=false;render()};
$("rs").onclick=()=>setMode("unknown");
$("rl").onclick=()=>setMode("learned");
$("am").onclick=()=>setMode("all");
$("all").onclick=()=>{
 const b=$("all");
 if(!armed){armed=true;b.textContent="Tap again to confirm";setTimeout(()=>{armed=false;b.textContent="Reset progress"},3000);return}
 armed=false;b.textContent="Reset progress";st={};save();setMode("all");
};
render();
</script></body></html>
